<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Autorización Digital de Descuento</title>
  <link rel="stylesheet" href="estilos-descuento.css" />
</head>
<body>
  <main class="contenedor">
    <header class="encabezado">
      <h1>Autorización Digital de Descuento</h1>
      <p class="subtitulo">Formulario de autorización para dispositivos corporativos</p>
    </header>

    <form id="formAutorizacion" class="formulario" novalidate>
      <fieldset>
        <legend>Datos del colaborador</legend>

        <label for="identificacion">Número de identificación</label>
        <input type="text" id="identificacion" name="identificacion" required
               inputmode="numeric" autocomplete="off" placeholder="Ej: 1030123456" />

        <button type="button" id="btnBuscar" class="boton-secundario">Buscar colaborador</button>

        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" readonly placeholder="Se completa automáticamente" />
      </fieldset>

      <fieldset>
        <legend>Datos del equipo</legend>

        <label for="codigoActivo">Código de activo</label>
        <input type="text" id="codigoActivo" name="codigoActivo" required placeholder="Ej: ACT-00123" />

        <label for="serial">Serial del equipo</label>
        <input type="text" id="serial" name="serial" required placeholder="Ej: SN-A1B2C3" />

        <label for="fecha">Fecha</label>
        <input type="text" id="fecha" name="fecha" readonly />
      </fieldset>

      <fieldset>
        <legend>Firma digital</legend>
        <canvas id="firmaCanvas" width="400" height="150" aria-label="Área de firma digital"></canvas>
        <div class="acciones-firma">
          <button type="button" id="btnLimpiarFirma" class="boton-secundario">Limpiar firma</button>
        </div>
      </fieldset>

      <p id="mensajeError" class="mensaje-error" role="alert" hidden></p>
      <p id="mensajeExito" class="mensaje-exito" role="status" hidden></p>

      <button type="submit" id="btnEnviar" class="boton-primario">Enviar autorización</button>
    </form>
  </main>

  <script src="config.js"></script>
  <script src="script-descuento.js"></script>
</body>
</html>
